<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Siya ❤️</title>
<style>
body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
font-family:Arial,sans-serif;background:linear-gradient(135deg,#ffd6e7,#fff0f6);text-align:center;color:#4a2434}
.card{background:white;border-radius:28px;padding:34px 25px;max-width:390px;margin:20px;box-shadow:0 12px 35px #0002}
h1{font-size:32px;margin:8px}.heart{font-size:55px;animation:pulse 1.2s infinite}
p{font-size:18px;line-height:1.6}
button{border:0;border-radius:30px;padding:14px 25px;font-size:17px;background:#ff5c8a;color:white}
#msg{display:none;margin-top:22px;font-size:19px}
@keyframes pulse{50%{transform:scale(1.15)}}
</style>
</head>
<body>
<div class="card">
<div class="heart">❤️</div>
<h1>Hey Siya ✨</h1>
<p>Someone made a little surprise just for you...</p>
<button onclick="document.getElementById('msg').style.display='block';this.style.display='none'">Tap for your surprise 💌</button>
<div id="msg">
<p><b>Siya,</b><br>
I don't need a special reason to tell you this…<br>
you make ordinary moments feel a little more special. ❤️</p>
<p>And if you're smiling right now,<br>
then my little surprise worked. 😌</p>
<p><b>— Sumit ❤️</b></p>
</div>
</div>
</body>
</html>
